<!DOCTYPE html>
<html>
<head>
    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            font-family: sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
        }

        .logo-wrapper {
            position: relative;
            width: 100px;
            height: 100px;
            margin-bottom: 20px;
        }

        .logo-wrapper img {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 64px;
            height: 64px;
            transform: translate(-50%, -50%);
        }

        .spinner {
            position: absolute;
            top: 0;
            left: 0;
            width: 100px;
            height: 100px;
            border: 5px solid #f3f3f3;
            border-top: 5px solid #0FD5FB;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            box-sizing: border-box;
        }

        h3 {
            margin: 0;
            margin-top: 14px;
            font-size: 25px;
            font-weight: 600;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: #0FD5FB;
            opacity: 0.85;
            animation: fade 1.5s ease-in-out infinite;
        }

        @keyframes fade {
            0%, 100% { opacity: 0.5; }
            50% { opacity: 1; }
        }



        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

<div class="logo-wrapper">
    <div class="spinner"></div>
</div>

<h3>Startar HoardBoard...</h3>

</body>
</html>
